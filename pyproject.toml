[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "line-assistant"
version = "0.1.0"
description = "LINE personal and group accounting assistant"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "line-bot-sdk>=3.16,<4",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6.0,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pillow>=11,<13",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"line_assistant" = ["py.typed"]
"line_assistant.seeds" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["line_assistant"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["linebot.*"]
ignore_missing_imports = true
